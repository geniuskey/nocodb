name: Community backend

on:
  push:
    branches: [main]
    paths:
      - "packages/nocodb/**"
      - "packages/nocodb-sdk/**"
      - "packages/nc-gui/**"
      - "tests/playwright/community/**"
      - "tests/playwright/playwright.community.config.ts"
      - "tests/playwright/package.json"
      - ".dockerignore"
      - "build-local-docker-image.sh"
      - "packages/noco-integrations/core/**"
      - "packages/noco-integrations/package.json"
      - "packages/noco-integrations/pnpm-lock.yaml"
      - "packages/noco-integrations/pnpm-workspace.yaml"
      - "scripts/check-community-boundaries.mjs"
      - "scripts/check-service-boundaries.mjs"
      - "scripts/check-migration-integrity.mjs"
      - "scripts/test-community-image.mjs"
      - "scripts/test-community-upgrade.mjs"
      - "scripts/check-vendored-assets.mjs"
      - "scripts/stage-community-gui.mjs"
      - "scripts/stage-community-gui.test.mjs"
      - "docs/VENDORED_ASSETS.json"
      - "docs/MIGRATION_MANIFEST.json"
      - "docs/SERVICE_BOUNDARIES.md"
      - "docs/SERVICE_BOUNDARY_EXCEPTIONS.json"
      - "docs/UPGRADE_FIXTURES.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/community-backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/nocodb/**"
      - "packages/nocodb-sdk/**"
      - "packages/nc-gui/**"
      - "tests/playwright/community/**"
      - "tests/playwright/playwright.community.config.ts"
      - "tests/playwright/package.json"
      - ".dockerignore"
      - "build-local-docker-image.sh"
      - "packages/noco-integrations/core/**"
      - "packages/noco-integrations/package.json"
      - "packages/noco-integrations/pnpm-lock.yaml"
      - "packages/noco-integrations/pnpm-workspace.yaml"
      - "scripts/check-community-boundaries.mjs"
      - "scripts/check-service-boundaries.mjs"
      - "scripts/check-migration-integrity.mjs"
      - "scripts/test-community-image.mjs"
      - "scripts/test-community-upgrade.mjs"
      - "scripts/check-vendored-assets.mjs"
      - "scripts/stage-community-gui.mjs"
      - "scripts/stage-community-gui.test.mjs"
      - "docs/VENDORED_ASSETS.json"
      - "docs/MIGRATION_MANIFEST.json"
      - "docs/SERVICE_BOUNDARIES.md"
      - "docs/SERVICE_BOUNDARY_EXCEPTIONS.json"
      - "docs/UPGRADE_FIXTURES.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/community-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Install pnpm
        run: npm install --global pnpm@9.15.5
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Community boundaries
        run: pnpm run check:community-boundaries
      - name: Check backend service boundaries
        run: pnpm run check:service-boundaries
      - name: Check vendored runtime assets
        run: pnpm run check:vendored-assets
      - name: Check migration integrity
        run: pnpm run check:migration-integrity
      - name: Test Community GUI staging
        run: pnpm run test:community-gui-stage
      - name: Build assembled Community application
        run: pnpm run build:community
      - name: Test Community GUI behavior
        run: pnpm --filter nc-gui run test:run
      - name: Build reproducible Community image
        run: docker build -f packages/nocodb/Dockerfile -t nocodb-community:test .
      - name: Verify bundled Litestream
        run: |
          docker run --rm --entrypoint litestream nocodb-community:test version | grep 'v0.3.13'
          docker run --rm --entrypoint /bin/sh nocodb-community:test -n /usr/src/appEntry/start.sh
      - name: Verify ARM64 Litestream artifact
        run: docker buildx build --platform linux/arm64 --target litestream-fetcher -f packages/nocodb/Dockerfile .
      - name: Install Chromium for Community acceptance
        run: pnpm --filter playwright exec playwright install --with-deps chromium
      - name: Upgrade v2025.10.0 metadata on SQLite
        run: COMMUNITY_IMAGE=nocodb-community:test pnpm run test:community:upgrade -- sqlite
      - name: Upgrade v2025.10.0 metadata on PostgreSQL
        run: COMMUNITY_IMAGE=nocodb-community:test pnpm run test:community:upgrade -- postgres
      - name: Upgrade v2025.10.0 metadata on MySQL
        run: COMMUNITY_IMAGE=nocodb-community:test pnpm run test:community:upgrade -- mysql
      - name: Browser-test Community image with SQLite
        run: COMMUNITY_IMAGE=nocodb-community:test pnpm run test:community:image -- sqlite
      - name: Browser-test Community image with PostgreSQL
        run: COMMUNITY_IMAGE=nocodb-community:test pnpm run test:community:image -- postgres
      - name: Browser-test Community image with MySQL
        run: COMMUNITY_IMAGE=nocodb-community:test pnpm run test:community:image -- mysql
      - name: Build Community integration interfaces
        run: pnpm run integrations:build:core
      - name: Test Community integration contracts
        run: pnpm --dir packages/noco-integrations test
      - name: Type-check Community backend
        run: pnpm --filter nocodb run typecheck:community
      - name: Run Community backend smoke test
        run: pnpm --filter nocodb run test:community:smoke
