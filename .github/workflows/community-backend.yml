name: Community backend

on:
  push:
    branches: [main]
    paths:
      - "packages/nocodb/**"
      - "packages/nocodb-sdk/**"
      - "packages/nc-gui/**"
      - ".dockerignore"
      - "build-local-docker-image.sh"
      - "packages/noco-integrations/core/**"
      - "packages/noco-integrations/package.json"
      - "packages/noco-integrations/pnpm-lock.yaml"
      - "packages/noco-integrations/pnpm-workspace.yaml"
      - "scripts/check-community-boundaries.mjs"
      - "scripts/check-vendored-assets.mjs"
      - "scripts/stage-community-gui.mjs"
      - "scripts/stage-community-gui.test.mjs"
      - "docs/VENDORED_ASSETS.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/community-backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/nocodb/**"
      - "packages/nocodb-sdk/**"
      - "packages/nc-gui/**"
      - ".dockerignore"
      - "build-local-docker-image.sh"
      - "packages/noco-integrations/core/**"
      - "packages/noco-integrations/package.json"
      - "packages/noco-integrations/pnpm-lock.yaml"
      - "packages/noco-integrations/pnpm-workspace.yaml"
      - "scripts/check-community-boundaries.mjs"
      - "scripts/check-vendored-assets.mjs"
      - "scripts/stage-community-gui.mjs"
      - "scripts/stage-community-gui.test.mjs"
      - "docs/VENDORED_ASSETS.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/community-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Install pnpm
        run: npm install --global pnpm@9.15.5
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Community boundaries
        run: pnpm run check:community-boundaries
      - name: Check vendored runtime assets
        run: pnpm run check:vendored-assets
      - name: Test Community GUI staging
        run: pnpm run test:community-gui-stage
      - name: Build assembled Community application
        run: pnpm run build:community
      - name: Test Community GUI behavior
        run: pnpm --filter nc-gui run test:run
      - name: Build reproducible Community image
        run: docker build -f packages/nocodb/Dockerfile -t nocodb-community:test .
      - name: Verify bundled Litestream
        run: |
          docker run --rm --entrypoint litestream nocodb-community:test version | grep 'v0.3.13'
          docker run --rm --entrypoint /bin/sh nocodb-community:test -n /usr/src/appEntry/start.sh
      - name: Verify ARM64 Litestream artifact
        run: docker buildx build --platform linux/arm64 --target litestream-fetcher -f packages/nocodb/Dockerfile .
      - name: Smoke-test Community image
        shell: bash
        run: |
          docker run --detach --name nocodb-community-smoke --publish 18080:8080 nocodb-community:test
          trap 'docker rm --force nocodb-community-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:18080/api/v1/health >/dev/null; then
              curl --fail --silent http://127.0.0.1:18080/dashboard/ >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs nocodb-community-smoke
          exit 1
      - name: Build Community integration interfaces
        run: pnpm run integrations:build:core
      - name: Test Community integration contracts
        run: pnpm --dir packages/noco-integrations test
      - name: Type-check Community backend
        run: pnpm --filter nocodb run typecheck:community
      - name: Run Community backend smoke test
        run: pnpm --filter nocodb run test:community:smoke
