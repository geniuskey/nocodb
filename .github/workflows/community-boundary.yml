name: Community source boundary

on:
  push:
    branches: [main]
    paths:
      - "packages/nc-gui/**"
      - "packages/nc-secret-mgr/**"
      - "packages/nocodb/src/public/**"
      - "packages/nocodb/src/meta/migrations/**"
      - "docs/MIGRATION_MANIFEST.json"
      - "docs/VENDORED_ASSETS.json"
      - "tests/playwright/**"
      - "scripts/**"
      - "package.json"
      - "build-local-docker-image.sh"
      - "build-local-ee-docker-image.sh"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "packages/nc-gui/**"
      - "packages/nc-secret-mgr/**"
      - "packages/nocodb/src/public/**"
      - "packages/nocodb/src/meta/migrations/**"
      - "docs/MIGRATION_MANIFEST.json"
      - "docs/VENDORED_ASSETS.json"
      - "tests/playwright/**"
      - "scripts/**"
      - "package.json"
      - "build-local-docker-image.sh"
      - "build-local-ee-docker-image.sh"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Check Community source boundaries
        run: node scripts/check-community-boundaries.mjs
      - name: Check vendored runtime assets
        run: node scripts/check-vendored-assets.mjs
      - name: Check append-only migration ledger
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_REVISION" ] && [ "$BASE_REVISION" != "0000000000000000000000000000000000000000" ]; then
            node scripts/check-migration-integrity.mjs --against "$BASE_REVISION"
          else
            node scripts/check-migration-integrity.mjs
          fi
